name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Tests use an embedded PostgreSQL binary, so no Docker service is needed.
      - run: mvn -B verify

  quickstart:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # Runs the README quick start for real: compose up, SQL insert, consume from Kafka.
      - run: ./scripts/smoke-test.sh
